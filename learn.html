<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoPlayer - 视频语言学习</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --secondary: #64748B;
            --accent: #F59E0B;
            --background: #0F172A;
            --surface: #1E293B;
            --surface-light: #334155;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --success: #10B981;
            --error: #EF4444;
            --subtitle-highlight: #FBBF24;
            --subtitle-font-size: 16px;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            --transition: 150ms ease-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Toolbar */
        .toolbar {
            background: var(--surface);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--surface-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
        }

        .logo svg {
            width: 32px;
            height: 32px;
        }

        .toolbar-divider {
            width: 1px;
            height: 32px;
            background: var(--surface-light);
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--surface-light);
            border: none;
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .toolbar-btn:hover {
            background: var(--primary);
        }

        .toolbar-btn:active {
            background: var(--primary-dark);
        }

        .toolbar-btn svg {
            width: 18px;
            height: 18px;
        }

        /* 字幕选择器 */
        .subtitle-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle-select {
            padding: 8px 12px;
            background: var(--surface-light);
            border: 1px solid var(--surface-light);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            min-width: 150px;
        }

        .subtitle-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .subtitle-select option {
            background: var(--surface);
            color: var(--text-primary);
        }

        .toolbar-btn.small-btn {
            padding: 8px;
        }

        .toolbar-btn.small-btn svg {
            width: 16px;
            height: 16px;
        }

        .toolbar-btn.active {
            background: var(--accent);
        }

        .toolbar-spacer {
            flex: 1;
        }

        /* Main Content */
        .main-content {
            display: flex;
            height: calc(100vh - 65px);
        }

        /* Left Panel - Vocabulary */
        .vocabulary-panel {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--surface-light);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .vocabulary-header {
            padding: 16px;
            border-bottom: 1px solid var(--surface-light);
        }

        .vocabulary-header h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vocabulary-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .vocabulary-item {
            padding: 12px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 4px;
            border-left: 3px solid transparent;
        }

        .vocabulary-item:hover {
            background: var(--surface-light);
        }

        .vocabulary-item.active {
            background: var(--primary);
            border-left-color: var(--accent);
        }

        .vocabulary-word {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .vocabulary-translation {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vocabulary-empty {
            padding: 24px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Right Panel - Word Details */
        .details-panel {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: var(--background);
        }

        .word-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .word-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-secondary);
        }

        .word-empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .word-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--surface-light);
        }

        .word-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .word-phonetic {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            color: var(--text-secondary);
        }

        .word-actions {
            display: flex;
            gap: 8px;
        }

        .word-action-btn {
            padding: 8px 12px;
            background: var(--surface-light);
            border: none;
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .word-action-btn:hover {
            background: var(--primary);
        }

        .word-action-btn.delete {
            background: var(--error);
        }

        .word-section {
            margin-bottom: 20px;
        }

        .word-section:last-child {
            margin-bottom: 0;
        }

        .word-section-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .word-section-content {
            font-size: 15px;
            line-height: 1.6;
        }

        .word-pos {
            display: inline-block;
            padding: 4px 10px;
            background: var(--primary);
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        /* 萌典 Heteronyms 详细样式 */
        .heteronym-details {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--surface-light);
        }

        .heteronym-header {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            margin: 12px 0 8px 0;
        }

        .heteronym-pinyin {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .heteronym-zhuyin {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .heteronym-def {
            margin-bottom: 12px;
            padding-left: 12px;
            border-left: 2px solid var(--surface-light);
        }

        .heteronym-type {
            display: inline-block;
            padding: 2px 6px;
            background: var(--secondary);
            border-radius: 3px;
            font-size: 11px;
            font-weight: 500;
            margin-right: 6px;
            color: var(--text-primary);
        }

        .heteronym-quotes {
            margin-top: 6px;
            padding-left: 8px;
        }

        .heteronym-quote {
            font-size: 12px;
            color: var(--text-secondary);
            font-style: italic;
            margin-bottom: 4px;
            line-height: 1.5;
        }

        /* Player Section */
        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .video-container {
            background: #000;
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            max-height: 60vh;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .video-placeholder svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Video Controls */
        .video-controls {
            background: var(--surface);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface-light);
            border: none;
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition);
        }

        .control-btn:hover {
            background: var(--primary);
        }

        .control-btn.play-btn {
            width: 48px;
            height: 48px;
            background: var(--primary);
        }

        .control-btn.play-btn:hover {
            background: var(--primary-dark);
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
        }

        .progress-container {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: var(--surface-light);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .progress-bar:hover .progress-fill {
            background: var(--accent);
        }

        .time-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            -webkit-appearance: none;
            background: var(--surface-light);
            border-radius: 2px;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Subtitle Bar */
        .subtitle-bar {
            background: var(--surface);
            border-top: 1px solid var(--surface-light);
            padding: 20px 24px;
            min-height: 140px;
        }

        .subtitle-row {
            padding: 10px 16px;
            font-size: 14px;
            color: var(--text-secondary);
            border-radius: var(--radius);
            margin-bottom: 8px;
            transition: all var(--transition);
        }

        .subtitle-row.current {
            background: rgba(245, 158, 11, 0.15);
            color: var(--text-primary);
            font-size: var(--subtitle-font-size);
            border-left: 4px solid var(--subtitle-highlight);
        }

        .subtitle-row:not(.current):hover {
            background: var(--surface-light);
        }

        .subtitle-word {
            cursor: pointer;
            transition: all var(--transition);
            border-radius: 2px;
            padding: 0 2px;
        }

        .subtitle-word:hover {
            background: var(--primary);
            color: white;
        }

        .subtitle-word.chinese:hover {
            background: var(--accent);
        }

        /* 拼音标注样式 */
        .pinyin-wrapper {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0;
        }

        .pinyin-char {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .pinyin-char:hover {
            background: var(--primary);
        }

        .pinyin-char:hover .pinyin-text {
            color: white;
        }

        .pinyin-char:hover .char-text {
            background: var(--primary);
            color: white;
        }

        .pinyin-text {
            font-size: 10px;
            color: var(--text-secondary);
            height: 16px;
            line-height: 16px;
        }

        .char-text {
            font-size: 18px;
            line-height: 1.2;
            min-width: 18px;
            text-align: center;
        }

        .subtitle-empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 20px;
        }

        /* Hidden file inputs */
        .hidden-input {
            display: none;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
        }

        .toast {
            background: var(--surface);
            padding: 12px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--error);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--surface);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-light);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--surface-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 工具栏容器 - 用于移动端布局 */
        .toolbar-container {
            display: contents;
        }

        /* 汉堡菜单按钮 */
        .hamburger-btn {
            display: none;
            width: 40px;
            height: 40px;
            background: var(--surface-light);
            border: none;
            border-radius: var(--radius);
            color: var(--text-primary);
            cursor: pointer;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all var(--transition);
        }

        .hamburger-btn:hover {
            background: var(--primary);
        }

        .hamburger-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 1px;
            transition: all 0.3s;
        }

        .hamburger-btn.active span:nth-child(1) {
            transform: rotate(45deg) translate(4px, 4px);
        }

        .hamburger-btn.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger-btn.active span:nth-child(3) {
            transform: rotate(-45deg) translate(4px, -4px);
        }

        .hamburger-btn svg {
            width: 20px;
            height: 20px;
        }

        /* 移动端菜单遮罩 */
        .mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .mobile-overlay.active {
            display: block;
            opacity: 1;
        }

        /* 移动端菜单面板 */
        .mobile-menu {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100vh;
            background: var(--surface);
            z-index: 200;
            transition: left 0.3s ease;
            overflow-y: auto;
            padding: 20px;
        }

        .mobile-menu.active {
            left: 0;
        }

        .mobile-menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--surface-light);
            margin-bottom: 16px;
        }

        .mobile-menu-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .mobile-menu-close {
            width: 36px;
            height: 36px;
            background: var(--surface-light);
            border: none;
            border-radius: var(--radius);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-menu-close:hover {
            background: var(--primary);
        }

        .mobile-menu-section {
            margin-bottom: 20px;
        }

        .mobile-menu-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .mobile-menu-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px;
            background: var(--surface-light);
            border: none;
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            margin-bottom: 8px;
        }

        .mobile-menu-btn:hover {
            background: var(--primary);
        }

        .mobile-menu-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* 响应式 - 平板 */
        @media (max-width: 1024px) {
            .vocabulary-panel {
                width: 240px;
            }
            
            .toolbar-btn span.btn-text {
                display: none;
            }
        }

        /* 响应式 - 移动端 */
        @media (max-width: 768px) {
            .hamburger-btn {
                display: flex;
            }

            .toolbar {
                padding: 10px 16px;
                gap: 10px;
            }

            .toolbar > .toolbar-btn:not(.hamburger-btn),
            .toolbar > .toolbar-divider,
            .toolbar > .subtitle-selector,
            .toolbar > .toolbar-spacer {
                display: none;
            }

            .main-content {
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 60px);
            }

            .vocabulary-panel {
                width: 100%;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--surface-light);
                display: none;
            }

            .vocabulary-panel.mobile-show {
                display: flex;
                max-height: 150px;
            }

            .vocabulary-header h2 {
                font-size: 14px;
            }

            .player-section {
                min-height: 0;
            }

            .video-container {
                max-height: 40vh;
            }

            .subtitle-bar {
                padding: 12px 16px;
                min-height: 100px;
            }

            .subtitle-row.current {
                font-size: 16px;
            }

            .subtitle-row {
                font-size: 13px;
                padding: 8px 12px;
            }

            .details-panel {
                padding: 16px;
                min-height: 200px;
            }

            .word-card {
                padding: 16px;
            }

            .word-title {
                font-size: 22px;
            }

            .video-controls {
                padding: 12px 16px;
                gap: 10px;
            }

            .control-btn {
                width: 36px;
                height: 36px;
            }

            .control-btn.play-btn {
                width: 44px;
                height: 44px;
            }

            .volume-slider {
                width: 60px;
            }

            /* 触摸友好的进度条 */
            .progress-bar {
                height: 10px;
                border-radius: 5px;
            }

            .progress-fill {
                border-radius: 5px;
            }
        }

        /* 响应式 - 小屏手机 */
        @media (max-width: 480px) {
            .toolbar {
                padding: 8px 12px;
            }

            .logo {
                font-size: 16px;
                gap: 8px;
            }

            .logo svg {
                width: 24px;
                height: 24px;
            }

            .video-container {
                max-height: 35vh;
            }

            .subtitle-bar {
                padding: 10px 12px;
                min-height: 80px;
            }

            .subtitle-row.current {
                font-size: 14px;
                padding: 6px 10px;
            }

            .subtitle-row {
                font-size: 12px;
                padding: 6px 10px;
            }

            .word-card {
                padding: 12px;
            }

            .word-title {
                font-size: 20px;
            }

            .word-phonetic {
                font-size: 14px;
            }

            .word-section-content {
                font-size: 14px;
            }

            .control-btn svg {
                width: 16px;
                height: 16px;
            }

            .time-display {
                font-size: 11px;
            }

            /* 隐藏移动端不必要的元素 */
            .mobile-only {
                display: block;
            }
        }

        .mobile-only {
            display: none;
        }

        /* 字幕栏显示切换按钮 - 移动端 */
        .toggle-panel-btn {
            display: none;
            position: fixed;
            bottom: 160px;
            right: 16px;
            width: 48px;
            height: 48px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            box-shadow: var(--shadow);
            z-index: 50;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .toggle-panel-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .toggle-panel-btn svg {
            width: 24px;
            height: 24px;
        }

        @media (max-width: 768px) {

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function parseSRT(content) {
            const subtitles = [];
            
            // 规范化换行符
            content = content.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            
            // 按行分割
            const allLines = content.split('\n');
            
            let i = 0;
            while (i < allLines.length) {
                // 跳过空行
                while (i < allLines.length && allLines[i].trim() === '') {
                    i++;
                }
                if (i >= allLines.length) break;
                
                // 解析索引行
                const indexLine = allLines[i].trim();
                const indexNum = parseInt(indexLine);
                if (isNaN(indexNum)) {
                    i++;
                    continue;
                }
                i++;
                if (i >= allLines.length) break;
                
                // 解析时间轴行
                const timeLine = allLines[i].trim();
                i++;
                
                // 匹配时间: 支持 2位 或 3位毫秒
                // 00:00:00,00 --> 00:00:02,64 或 00:00:00,000 --> 00:00:02,640
                const timeMatch = timeLine.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{2,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{2,3})/);
                if (!timeMatch) {
                    continue;
                }
                
                // 毫秒可能是2位或3位，标准化为3位
                const startMs = timeMatch[4].padEnd(3, '0');
                const endMs = timeMatch[8].padEnd(3, '0');
                
                const startTime = parseInt(timeMatch[1]) * 3600 + parseInt(timeMatch[2]) * 60 + parseInt(timeMatch[3]) + parseInt(startMs) / 1000;
                const endTime = parseInt(timeMatch[5]) * 3600 + parseInt(timeMatch[6]) * 60 + parseInt(timeMatch[7]) + parseInt(endMs) / 1000;
                
                // 收集文本行直到遇到空行或索引行
                const textLines = [];
                while (i < allLines.length && allLines[i].trim() !== '' && isNaN(parseInt(allLines[i].trim()))) {
                    textLines.push(allLines[i]);
                    i++;
                }
                
                const text = textLines.join('\n').trim();
                if (text) {
                    subtitles.push({
                        index: indexNum,
                        startTime,
                        endTime,
                        text
                    });
                }
            }
            
            return subtitles;
        }

        // 中文翻译API
        async function translateChinese(text) {
            const api = state.settings.translationApi;
            const apiKey = state.settings.apiKey;
            const customUrl = state.settings.customApiUrl;

            try {
                switch (api) {
                    case 'mymemory':
                        return await translateWithMyMemory(text);
                    case 'caiyun':
                        return await translateWithCaiyun(text, apiKey);
                    case 'libretranslate':
                        return await translateWithLibreTranslate(text, apiKey, customUrl);
                    case 'deepl':
                        return await translateWithDeepL(text, apiKey);
                    case 'google':
                        return await translateWithGoogle(text, apiKey);
                    case 'moedict':
                        return await translateWithMoedict(text);
                    default:
                        return await translateWithMyMemory(text);
                }
            } catch (error) {
                console.error('Translation error:', error);
                return { translation: '翻译失败', definition: text };
            }
        }

        async function translateWithMyMemory(text) {
            const response = await fetch(
                `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh-CN|en`
            );
            if (!response.ok) throw new Error('MyMemory API error');
            const data = await response.json();
            return {
                translation: data.responseData?.translatedText || '无翻译',
                definition: data.responseData?.translatedText || text
            };
        }

        async function translateWithCaiyun(text, apiKey) {
            if (!apiKey) {
                return await translateWithMyMemory(text);
            }
            const response = await fetch('https://api.interpreter.caiyunai.com/api/v1/translator', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    source: 'auto',
                    target: 'en',
                    raw_source_language_type: 'ZH',
                    translated_text: text
                })
            });
            if (!response.ok) throw new Error('Caiyun API error');
            const data = await response.json();
            return {
                translation: data.target || data.response?.targets?.[0] || '无翻译',
                definition: data.target || text
            };
        }

        async function translateWithLibreTranslate(text, apiKey, customUrl) {
            const endpoint = customUrl || API_CONFIG.libretranslate.endpoint;
            const headers = {
                'Content-Type': 'application/json'
            };
            if (apiKey) {
                headers['Authorization'] = `Bearer ${apiKey}`;
            }
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify({
                    q: text,
                    source: 'zh',
                    target: 'en',
                    format: 'text'
                })
            });
            if (!response.ok) throw new Error('LibreTranslate API error');
            const data = await response.json();
            return {
                translation: data.translatedText || '无翻译',
                definition: data.translatedText || text
            };
        }

        async function translateWithDeepL(text, apiKey) {
            if (!apiKey) {

            }
            const response = await fetch('https://api-free.deepl.com/v2/translate', {

                    'Content-Type': 'application/x-www-form-urlencoded',

            const data = await response.json();
            return {
                translation: data.translations?.[0]?.text || '无翻译',
                definition: data.translations?.[0]?.text || text
            };
        }

        // 萌典 Moedict - 台湾线上中文字典
        async function translateWithMoedict(text) {
            console.log('Moedict: 查询词', text);
            
            try {
                const response = await fetch(
                    `https://www.moedict.tw/uni/${encodeURIComponent(text)}`
                );
                console.log('Moedict: 响应状态', response.status);
                
                if (!response.ok) throw new Error('Moedict API error: ' + response.status);
                const data = await response.json();
                console.log('Moedict: 原始数据', JSON.stringify(data).substring(0, 500));

                // 解析萌典返回的数据
                const result = {
                    radical: data.radical || '',
                    stroke_count: data.stroke_count || '',
                    heteronyms: []
                };

                // 解析 heteronyms 数组 - 萌典返回的是 heteronyms 字段
                const heteronyms = data.heteronyms || data.h || [];
                console.log('Moedict: heteronyms 数据', Array.isArray(heteronyms) ? heteronyms.length : 'not array');
                
                const heteronymList = Array.isArray(heteronyms) ? heteronyms : [heteronyms];

                heteronymList.forEach(h => {
                    const item = {
                        pinyin: h.bopomofo2 || h.bopomofo || '',
                        pinyinZhuyin: h.bopomofo || '',
                        definitions: []
                    };

                    // 解析 definitions 数组
                    const defs = h.definitions || h.d || [];
                    const defList = Array.isArray(defs) ? defs : [defs];

                    defList.forEach(d => {
                        if (typeof d === 'string') {
                            item.definitions.push({
                                type: '',
                                def: d,
                                quote: []
                            });
                        } else if (d.def) {
                            item.definitions.push({
                                type: d.type || '',
                                def: d.def,
                                quote: d.quote || []
                            });
                        }
                    });

                    result.heteronyms.push(item);
                });

                console.log('Moedict: 解析后结果', JSON.stringify(result).substring(0, 500));

                // 构建兼容的 translation 和 definition（用于词汇列表显示）
                const firstDef = result.heteronyms[0]?.definitions[0];
                result.translation = firstDef?.def || '无释义';
                result.definition = firstDef?.def || '无释义';
                result.phonetic = result.heteronyms[0]?.pinyin || '';
                result.partOfSpeech = firstDef?.type || '';
                result.sentence = firstDef?.quote?.[0] || '';

                return result;
            } catch (error) {
                console.error('Moedict 错误:', error);
                // 如果萌典失败，尝试使用 MyMemory 作为后备
                console.log('Moedict: 使用 MyMemory 后备');
                return await translateWithMyMemory(text);
            }
        }

        async function lookupWord(word) {
            const isChinese = /[\u4e00-\u9fa5]/.test(word);
            
            try {
                if (isChinese) {
                    // 中文 - 使用配置的翻译API
                    const api = state.settings.translationApi;
                    console.log('lookupWord: 当前 API', api, '查询词', word);
                    
                    if (api === 'moedict') {
                        // 萌典返回完整结构
                        const result = await translateWithMoedict(word);
                        console.log('lookupWord: 萌典返回结果', JSON.stringify(result).substring(0, 300));
                        return {
                            type: 'chinese',
                            word: word,
                            radical: result.radical,
                            stroke_count: result.stroke_count,
                            heteronyms: result.heteronyms,
                            translation: result.translation,
                            definition: result.definition,
                            phonetic: result.phonetic,
                            partOfSpeech: result.partOfSpeech,
                            sentence: result.sentence
                        };
                    } else {
                        // 其他翻译API
                        console.log('lookupWord: 使用其他 API', api);
                        const result = await translateChinese(word);
                        return {
                            type: 'chinese',
                            word: word,
                            translation: result.translation,
                            definition: result.definition
                        };
                    }
                } else {
                    // 英文词典 - 使用 Free Dictionary API
                    const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                    if (!response.ok) {
                        return null;
                    }
                    const data = await response.json();
                    return { type: 'english', ...data[0] };
                }
            } catch (error) {
                console.error('Dictionary lookup failed:', error);
                return null;
            }
        }

        function extractWordInfo(apiData, word, sentence) {
            if (!apiData) {
                return {
                    word: word,
                    phonetic: '',
                    partOfSpeech: '',
                    definition: '未找到释义',
                    translation: '未找到翻译',
                    sentence: sentence
                };
            }

            if (apiData.type === 'chinese') {
                // 中文词条信息 - 保留萌典完整数据
                const result = {
                    word: apiData.word,
                    phonetic: apiData.phonetic || '',
                    partOfSpeech: apiData.partOfSpeech || '中文',
                    definition: apiData.definition || '',
                    translation: apiData.translation || '',
                    sentence: sentence
                };
                // 保留萌典 heteronyms 数据
                if (apiData.heteronyms) {
                    result.heteronyms = apiData.heteronyms;
                }
                if (apiData.radical) {
                    result.radical = apiData.radical;
                }
                if (apiData.stroke_count) {
                    result.stroke_count = apiData.stroke_count;
                }
                return result;
            }

            // Get phonetic
            const phonetic = apiData.phonetic || apiData.phonetics?.[0]?.text || '';

            // Get first meaning
            const meaning = apiData.meanings?.[0];
            const partOfSpeech = meaning?.partOfSpeech || '';
            const definition = meaning?.definitions?.[0]?.definition || '无释义';

            return {
                word: apiData.word || word,
                phonetic: phonetic,
                partOfSpeech: partOfSpeech,
                definition: definition,
                translation: '（请参考英文释义）',
                sentence: sentence
            };
        }

        // ============================================
        // Subtitle Functions
        // ============================================
        function loadSubtitles(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                const subtitles = parseSRT(content);
                
                // 创建新的字幕轨道
                const trackId = 'track_' + Date.now();
                const trackName = file.name.replace(/\.(srt|vtt|ass)$/i, '');
                
                const newTrack = {
                    id: trackId,
                    name: trackName,
                    subtitles: subtitles
                };
                
                state.subtitleTracks.push(newTrack);
                state.activeTrackId = trackId;
                
                updateSubtitleSelector();
                showToast(`字幕 "${trackName}" 加载成功，共 ${subtitles.length} 条`);
                updateSubtitleDisplay();
            };
            reader.onerror = () => {
                showToast('字幕文件读取失败', 'error');
            };
            reader.readAsText(file);
        }

        function updateSubtitleSelector() {
            const select = elements.subtitleTrackSelect;
            const removeBtn = elements.removeSubtitleBtn;
            
            // 清空并重新填充选项
            select.innerHTML = '<option value="">-- 选择字幕 --</option>';
            
            state.subtitleTracks.forEach(track => {
                const option = document.createElement('option');
                option.value = track.id;
                option.textContent = `${track.name} (${track.subtitles.length}条)`;
                if (track.id === state.activeTrackId) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
            
            // 显示/隐藏删除按钮
            if (state.subtitleTracks.length > 0) {
                removeBtn.style.display = 'flex';
            } else {
                removeBtn.style.display = 'none';
            }
            
            // 更新移动端选择器
            if (typeof updateMobileSubtitleSelect === 'function') {
                updateMobileSubtitleSelect();
            }
        }

        function switchSubtitleTrack(trackId) {
            if (trackId === state.activeTrackId) return;
            
            state.activeTrackId = trackId || null;
            state.currentSubtitleIndex = -1;
            updateSubtitleSelector();
            updateSubtitleDisplay();
        }

        function removeSubtitleTrack(trackId) {
            const index = state.subtitleTracks.findIndex(t => t.id === trackId);
            if (index === -1) return;
            
            const trackName = state.subtitleTracks[index].name;
            state.subtitleTracks.splice(index, 1);
            
            if (state.activeTrackId === trackId) {
                state.activeTrackId = state.subtitleTracks.length > 0 ? state.subtitleTracks[0].id : null;
            }
            
            state.currentSubtitleIndex = -1;
            updateSubtitleSelector();
            updateSubtitleDisplay();
            showToast(`字幕 "${trackName}" 已删除`);
        }

        function updateCurrentSubtitle(currentTime) {
            if (!state.activeTrackId) return;
            
            const activeTrack = state.subtitleTracks.find(t => t.id === state.activeTrackId);
            if (!activeTrack) return;
            
            let newIndex = -1;
            for (let i = 0; i < activeTrack.subtitles.length; i++) {
                const sub = activeTrack.subtitles[i];
                if (currentTime >= sub.startTime && currentTime <= sub.endTime) {
                    newIndex = i;
                    break;
                }
            }
            
            if (newIndex !== state.currentSubtitleIndex) {
                state.currentSubtitleIndex = newIndex;
                updateSubtitleDisplay();
            }
        }

        function updateSubtitleDisplay() {
            if (state.subtitleTracks.length === 0) {
                elements.subtitleBar.innerHTML = `
                    <div class="subtitle-empty">
                        请导入字幕文件以显示字幕
                    </div>
                `;
                return;
            }

            // 为每个字幕轨道获取当前字幕
            const trackSubtitles = state.subtitleTracks.map((track, trackIndex) => {
                let current = -1;
                const videoTime = elements.videoPlayer.currentTime;
                
                for (let i = 0; i < track.subtitles.length; i++) {
                    const sub = track.subtitles[i];
                    if (videoTime >= sub.startTime && videoTime <= sub.endTime) {
                        current = i;
                        break;
                    }
                }
                
                return {
                    track,
                    current,
                    prev: current > 0 ? track.subtitles[current - 1] : null,
                    currentSub: current >= 0 ? track.subtitles[current] : null,
                    next: current < track.subtitles.length - 1 ? track.subtitles[current + 1] : null
                };
            });

            // 为每个轨道生成字幕行（不显示轨道标签）
            let html = '';
            
            trackSubtitles.forEach((ts, index) => {
                // 上一条
                if (ts.prev) {
                    html += `<div class="subtitle-row">${highlightWords(ts.prev.text)}</div>`;
                }
                
                // 当前
                if (ts.currentSub) {
                    html += `<div class="subtitle-row current">${highlightWords(ts.currentSub.text)}</div>`;
                } else {
                    html += `<div class="subtitle-row current" style="color: var(--text-secondary);">等待字幕...</div>`;
                }
                
                // 下一条
                if (ts.next) {
                    html += `<div class="subtitle-row">${highlightWords(ts.next.text)}</div>`;
                }
            });
            
            elements.subtitleBar.innerHTML = html;
            
            // Add click handlers to words
            elements.subtitleBar.querySelectorAll('.subtitle-word').forEach(wordEl => {
                wordEl.addEventListener('click', handleWordClick);
            });
        }

        function highlightWords(text) {
            // 匹配英文单词或中文字符（逐字处理）
            // 英文: [a-zA-Z']+
            // 中文: 每个 [\u4e00-\u9fa5]
            // 分别包装为可点击的span
            
            // 如果开启了拼音显示，使用带拼音的版本
            if (state.showPinyin && typeof pinyin !== 'undefined') {
                return highlightWordsWithPinyin(text);
            }
            
            return text.replace(/([a-zA-Z']+)|([\u4e00-\u9fa5])|([^\sa-zA-Z\u4e00-\u9fa5']+)/g, (match, english, chinese, punctuation) => {
                if (english) {
                    return `<span class="subtitle-word">${english}</span>`;
                } else if (chinese) {
                    return `<span class="subtitle-word chinese">${chinese}</span>`;
                } else {
                    return punctuation;
                }
            });
        }

        function highlightWordsWithPinyin(text) {
            // 先提取所有内容片段
            const segments = [];
            const regex = /([a-zA-Z']+)|([\u4e00-\u9fa5])|([^\sa-zA-Z\u4e00-\u9fa5']+)/g;
            let match;
            
            while ((match = regex.exec(text)) !== null) {
                segments.push({
                    type: match[1] ? 'english' : (match[2] ? 'chinese' : 'other'),
                    text: match[0]
                });
            }
            
            // 分离中英文部分
            let html = '';
            let currentChinese = '';
            
            for (const seg of segments) {
                if (seg.type === 'english') {
                    // 输出之前积累的中文
                    if (currentChinese) {
                        html += wrapChineseWithPinyin(currentChinese);
                        currentChinese = '';
                    }
                    html += `<span class="subtitle-word">${seg.text}</span>`;
                } else if (seg.type === 'chinese') {
                    currentChinese += seg.text;
                } else {
                    // 其他符号（如空格、标点）
                    if (currentChinese) {
                        html += wrapChineseWithPinyin(currentChinese);
                        currentChinese = '';
                    }
                    html += seg.text;
                }
            }
            
            // 处理最后的中文
            if (currentChinese) {
                html += wrapChineseWithPinyin(currentChinese);
            }
            
            return html;
        }

        function wrapChineseWithPinyin(text) {
            // 获取拼音
            const pinyinText = pinyin(text, { toneType: 'none' });
            const pinyins = pinyinText.split(' ').map(p => p.charAt(0).toUpperCase() + p.slice(1));
            
            let html = '<span class="pinyin-wrapper">';
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const py = pinyins[i] || '';
                html += `<span class="pinyin-char" data-char="${char}">
                    <span class="pinyin-text">${py}</span>
                    <span class="char-text">${char}</span>
                </span>`;
            }
            html += '</span>';
            return html;
        }

        async function handleWordClick(e) {
            e.stopPropagation();
            
            // 暂停视频
            if (!elements.videoPlayer.paused) {
                elements.videoPlayer.pause();
            }
            
            // 获取用户选中的文本
            const selection = window.getSelection();
            let rawWord = '';
            let sentence = '';
            
            if (selection && selection.toString().trim().length > 0) {
                // 用户有选中文本
                rawWord = selection.toString().trim();
            } else {
                // 用户没有选中文本，使用点击的元素的文本
                const target = e.target;
                
                // 如果点击的是拼音字符，获取汉字
                if (target.classList.contains('pinyin-char')) {
                    rawWord = target.dataset.char || target.textContent.trim();
                } else if (target.classList.contains('char-text')) {
                    rawWord = target.textContent.trim();
                } else if (target.classList.contains('pinyin-text')) {
                    // 点击拼音，查找相邻的汉字
                    const pinyinChar = target.closest('.pinyin-char');
                    rawWord = pinyinChar?.dataset.char || '';
                } else {
                    rawWord = target.textContent.trim();
                }
            }
            
            if (!rawWord) return;
            
            // 判断是否为中文
            const isChinese = /[\u4e00-\u9fa5]/.test(rawWord);
            const isEnglish = /[a-zA-Z]/.test(rawWord);
            
            // 如果既不是中文也不是英文，跳过
            if (!isChinese && !isEnglish) return;
            
            // 标准化英文单词
            const word = isEnglish && !isChinese ? rawWord.toLowerCase().replace(/'/g, '') : rawWord;
            
            // 从点击的区域获取句子上下文
            const subtitleRow = e.target.closest('.subtitle-row');
            if (subtitleRow) {
                // 获取纯文本（移除拼音显示）
                const pureText = [];
                subtitleRow.querySelectorAll('.char-text').forEach(el => pureText.push(el.textContent));
                // 同时保留原有的 subtitle-word 元素文本
                subtitleRow.querySelectorAll('.subtitle-word:not(.chinese)').forEach(el => pureText.push(el.textContent));
                sentence = pureText.join('').replace(/\s+/g, ' ').trim() || subtitleRow.textContent.replace(/\s+/g, ' ').trim();
            }
            
            let wordInfo;
            
            if (isChinese) {
                // 中文字词 - 查询翻译
                const apiData = await lookupWord(word);
                wordInfo = extractWordInfo(apiData, word, sentence);
            } else {
                // 英文字词 - 查询词典
                const apiData = await lookupWord(word);
                wordInfo = extractWordInfo(apiData, word, sentence);
            }
            
            // Update selected word
            state.selectedWord = word;
            state.selectedWordData = wordInfo;
            
            // Display word details
            displayWordDetails(wordInfo);
            
            // Add to vocabulary
            addToVocabulary(wordInfo);
        }

        // ============================================
        // Word Details Functions
        // ============================================
        function displayWordDetails(wordInfo) {
            console.log('displayWordDetails: 接收数据', JSON.stringify(wordInfo).substring(0, 500));
            
            elements.wordEmptyState.style.display = 'none';
            elements.wordDetails.style.display = 'block';
            
            elements.detailWord.textContent = wordInfo.word;
            elements.detailPhonetic.textContent = wordInfo.phonetic || '';
            elements.detailPos.textContent = wordInfo.partOfSpeech || '未知';
            elements.detailDefinition.textContent = wordInfo.definition || '';
            elements.detailTranslation.textContent = wordInfo.translation || '';
            elements.detailSentence.textContent = wordInfo.sentence || '';
            
            // Highlight current word in vocabulary list
            updateVocabularyHighlight(wordInfo.word);
            
            // 萌典 heteronyms 详细展示 - 在 definition 区域追加显示
            console.log('displayWordDetails: heteronyms', wordInfo.heteronyms?.length, wordInfo.heteronyms);
            if (wordInfo.heteronyms && wordInfo.heteronyms.length > 0) {
                let detailedHtml = '';
                
                wordInfo.heteronyms.forEach((h, idx) => {
                    if (wordInfo.heteronyms.length > 1) {
                        detailedHtml += `<div class="heteronym-header">发音 ${idx + 1}</div>`;
                    }
                    
                    // 拼音（如果有注音符号也显示）
                    if (h.pinyin) {
                        detailedHtml += `<div class="heteronym-pinyin">拼音: ${h.pinyin}</div>`;
                    }
                    if (h.pinyinZhuyin && h.pinyinZhuyin !== h.pinyin) {
                        detailedHtml += `<div class="heteronym-zhuyin">注音: ${h.pinyinZhuyin}</div>`;
                    }
                    
                    // 释义列表
                    if (h.definitions && h.definitions.length > 0) {
                        h.definitions.forEach((def, defIdx) => {
                            const typeLabel = def.type ? `<span class="heteronym-type">${def.type}</span>` : '';
                            const quoteList = def.quote && def.quote.length > 0 
                                ? `<div class="heteronym-quotes">${def.quote.map(q => `<div class="heteronym-quote">「${q}」</div>`).join('')}</div>` 
                                : '';
                            
                            detailedHtml += `
                                <div class="heteronym-def">
                                    <div>${typeLabel}${defIdx + 1}. ${def.def}</div>
                                    ${quoteList}
                                </div>
                            `;
                        });
                    }
                });
                
                // 追加到释义区域
                elements.detailDefinition.innerHTML = wordInfo.definition || '';
                elements.detailDefinition.innerHTML += `<div class="heteronym-details">${detailedHtml}</div>`;
                
                // 更新词性显示
                if (wordInfo.heteronyms[0]?.definitions[0]?.type) {
                    const types = [...new Set(wordInfo.heteronyms.flatMap(h => h.definitions?.map(d => d.type) || []).filter(Boolean))];
                    elements.detailPos.textContent = types.join('、');
                }
            }
        }

        function updateVocabularyHighlight(word) {
            document.querySelectorAll('.vocabulary-item').forEach(item => {
                item.classList.toggle('active', item.dataset.word === word);
            });
        }

        // ============================================
        // Vocabulary Functions
        // ============================================
        function loadVocabulary() {
            const saved = localStorage.getItem('lingoplayer_vocabulary');
            if (saved) {
                try {
                    state.vocabulary = JSON.parse(saved);
                } catch (e) {
                    state.vocabulary = [];
                }
            }
            renderVocabularyList();
        }

        function saveVocabulary() {
            localStorage.setItem('lingoplayer_vocabulary', JSON.stringify(state.vocabulary));
        }

        function addToVocabulary(wordInfo) {
            // Check if word already exists
            const existingIndex = state.vocabulary.findIndex(w => w.word.toLowerCase() === wordInfo.word.toLowerCase());
            
            if (existingIndex >= 0) {
                // Update existing
                state.vocabulary[existingIndex] = wordInfo;
            } else {
                // Add new
                state.vocabulary.unshift(wordInfo);
            }
            
            saveVocabulary();
            renderVocabularyList();
            updateVocabularyHighlight(wordInfo.word);
        }

        function removeFromVocabulary(word) {
            state.vocabulary = state.vocabulary.filter(w => w.word.toLowerCase() !== word.toLowerCase());
            saveVocabulary();
            renderVocabularyList();
            
            if (state.selectedWord?.toLowerCase() === word.toLowerCase()) {
                state.selectedWord = null;
                state.selectedWordData = null;
                elements.wordDetails.style.display = 'none';
                elements.wordEmptyState.style.display = 'flex';
            }
            
            showToast('单词已删除');
        }

        function renderVocabularyList() {
            if (state.vocabulary.length === 0) {
                elements.vocabularyList.innerHTML = `
                    <div class="vocabulary-empty">
                        暂无词汇<br>
                        <small>点击字幕中的单词添加</small>
                    </div>
                `;
                return;
            }
            
            elements.vocabularyList.innerHTML = state.vocabulary.map(item => `
                <div class="vocabulary-item" data-word="${item.word}">
                    <div class="vocabulary-word">${item.word}</div>
                    <div class="vocabulary-translation">${item.translation}</div>
                </div>
            `).join('');
            
            // Add click handlers
            elements.vocabularyList.querySelectorAll('.vocabulary-item').forEach(item => {
                item.addEventListener('click', () => {
                    const word = item.dataset.word;
                    const wordData = state.vocabulary.find(w => w.word === word);
                    if (wordData) {
                        state.selectedWord = word;
                        state.selectedWordData = wordData;
                        displayWordDetails(wordData);
                    }
                });
            });
        }

        // ============================================
        // Event Listeners
        // ============================================
        function initEventListeners() {
            // File inputs
            elements.openVideoBtn.addEventListener('click', () => elements.videoInput.click());
            elements.importSubtitleBtn.addEventListener('click', () => elements.subtitleInput.click());
            
            elements.videoInput.addEventListener('change', (e) => {
                console.log('videoInput change 事件触发, 文件数:', e.target.files?.length || 0);
                if (e.target.files && e.target.files[0]) {
                    console.log('选择的文件:', e.target.files[0].name, e.target.files[0].size);
                    openVideo(e.target.files[0]);
                }
            });
            
            elements.subtitleInput.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    loadSubtitles(e.target.files[0]);
                }
            });
            
            // 字幕选择器
            elements.subtitleTrackSelect.addEventListener('change', (e) => {
                switchSubtitleTrack(e.target.value);
            });
            
            elements.removeSubtitleBtn.addEventListener('click', () => {
                const selectedId = elements.subtitleTrackSelect.value;
                if (selectedId) {
                    removeSubtitleTrack(selectedId);
                }
            });
            
            // 拼音开关
            elements.togglePinyinBtn.addEventListener('click', () => {
                state.showPinyin = !state.showPinyin;
                elements.togglePinyinBtn.classList.toggle('active', state.showPinyin);
                updateSubtitleDisplay();
            });
            
            // Video player
            elements.playPauseBtn.addEventListener('click', togglePlay);
            elements.skipBackBtn.addEventListener('click', () => skipTime(-5));
            elements.skipForwardBtn.addEventListener('click', () => skipTime(5));
            
            elements.progressBar.addEventListener('click', seekVideo);
            
            elements.videoPlayer.addEventListener('timeupdate', updateProgress);
            elements.videoPlayer.addEventListener('play', updatePlayButton);
            elements.videoPlayer.addEventListener('pause', updatePlayButton);
            elements.videoPlayer.addEventListener('loadedmetadata', updateProgress);
            
            elements.volumeSlider.addEventListener('input', (e) => {
                elements.videoPlayer.volume = e.target.value;
            });
            
            // Word actions
            elements.playContextBtn.addEventListener('click', () => {
                if (state.selectedWordData && state.currentSubtitleIndex >= 0 && state.activeTrackId) {
                    const activeTrack = state.subtitleTracks.find(t => t.id === state.activeTrackId);
                    if (activeTrack) {
                        const sub = activeTrack.subtitles[state.currentSubtitleIndex];
                        if (sub) {
                            elements.videoPlayer.currentTime = sub.startTime;
                            elements.videoPlayer.play();
                        }
                    }
                }
            });
            
            elements.deleteWordBtn.addEventListener('click', () => {
                if (state.selectedWord) {
                    removeFromVocabulary(state.selectedWord);
                }
            });
            
            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Ignore if typing in input
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                switch (e.code) {
                    case 'Space':
                        e.preventDefault();
                        togglePlay();
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        skipTime(-5);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        skipTime(5);
                        break;
                    case 'ArrowUp':
                        e.preventDefault();
                        elements.videoPlayer.volume = Math.min(1, elements.videoPlayer.volume + 0.1);
                        elements.volumeSlider.value = elements.videoPlayer.volume;
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        elements.videoPlayer.volume = Math.max(0, elements.videoPlayer.volume - 0.1);
                        elements.volumeSlider.value = elements.videoPlayer.volume;
                        break;
                }
            });
        }

            elements.settingsBtn.addEventListener('click', openSettings);

            // 关闭设置
            elements.settingsClose.addEventListener('click', closeSettings);
            elements.settingsOverlay.addEventListener('click', (e) => {
                if (e.target === elements.settingsOverlay) {
                    closeSettings();
                }
            });

            // 字体大小滑块
            elements.fontSizeSlider.addEventListener('input', (e) => {
                state.settings.fontSize = parseInt(e.target.value);
                applySettings();
                saveSettings();
            });

            // 播放速度选择
            elements.playbackSpeedSelect.addEventListener('change', (e) => {
                state.settings.playbackSpeed = parseFloat(e.target.value);
                elements.videoPlayer.playbackRate = state.settings.playbackSpeed;
                saveSettings();
                showToast(`播放速度: ${state.settings.playbackSpeed}x`);
            });

            // 翻译API选择
            elements.translationApiSelect.addEventListener('change', (e) => {
                state.settings.translationApi = e.target.value;
                updateApiKeyHint(e.target.value);
                saveSettings();
                showToast(`翻译API: ${API_CONFIG[e.target.value]?.name || e.target.value}`);
            });

            // API Key输入
            elements.apiKeyInput.addEventListener('input', (e) => {
                state.settings.apiKey = e.target.value;
                saveSettings();
            });

            // 自定义API URL输入
            elements.customApiUrlInput.addEventListener('input', (e) => {
                state.settings.customApiUrl = e.target.value;
                saveSettings();
            });

            // 显示/隐藏API Key
            elements.toggleApiKeyBtn.addEventListener('click', () => {
                const isPassword = elements.apiKeyInput.type === 'password';
                elements.apiKeyInput.type = isPassword ? 'text' : 'password';
                elements.toggleApiKeyBtn.textContent = isPassword ? '隐藏' : '显示';
            });

            // 测试API连接
            elements.testApiBtn.addEventListener('click', () => {
                testApiConnection();
            });
        }

        init();
    </script>
</body>
</html>
